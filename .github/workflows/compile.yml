name: Compilar postmarketOS para gtowifi

on:
  workflow_dispatch: # Activa la compilación con un botón

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Actualizar sistema e instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip openssl git

    - name: Ejecutar instalacion nativa de pmbootstrap
      run: |
        git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git --depth 1
        cd pmbootstrap
        mkdir -p ~/.local/bin
        ln -s "$PWD/pmbootstrap.py" ~/.local/bin/pmbootstrap
        ./pmbootstrap.py --version

    - name: Verificar versión de pmbootstrap
      run: |
        pmbootstrap --version

    - name: Inicializar configuración de pmbootstrap
      run: |
        mkdir -p ~/.config
        # Genera el archivo de configuración con los parámetros válidos actuales
        cat <<EOF > ~/.config/pmbootstrap.cfg
        [pmbootstrap]
        aports = /home/runner/work/pmbootstrap_work/cache_aports
        work = /home/runner/work/pmbootstrap_work
        jobs = 4
        mirror_alpine = http://alpinelinux.org
        device = samsung-gtowifi
        ui = phosh
        is_default_channel = True
        EOF
        # Inicializa pmbootstrap aplicando silenciosamente la configuración anterior
        pmbootstrap init --jobs=4

    - name: Compilar imagen
      run: |
        pmbootstrap install --as-root

    - name: Exportar archivos .img
      run: |
        pmbootstrap export --dest /home/runner/work/export

    - name: Subir imágenes como artefacto de descarga
      uses: actions/upload-artifact@v4
      with:
        name: imagenes-samsung-gtowifi
        path: /home/runner/work/export/*
