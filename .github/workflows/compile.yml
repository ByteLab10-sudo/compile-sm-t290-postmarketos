name: Compilar postmarketOS para gtowifi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            openssl

      - name: Instalar pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$HOME/pmbootstrap"

          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$HOME/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verificar pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap --version

      - name: Configurar pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          WORK="$HOME/pmbootstrap-work"
          APORTS="$WORK/cache_aports"

          mkdir -p "$WORK"

          pmbootstrap config work "$WORK"
          pmbootstrap config aports "$APORTS"
          pmbootstrap config device samsung-gtowifi
          pmbootstrap config ui phosh
          pmbootstrap config jobs 4
          pmbootstrap config is_default_channel true

      - name: Inicializar pmbootstrap
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap init --shallow-initial-clone

      - name: Verificar dispositivo
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap status

      - name: Compilar imagen
        shell: bash
        run: |
          set -euo pipefail

          pmbootstrap install

      - name: Exportar imagen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/export"

          pmbootstrap export "$GITHUB_WORKSPACE/export"

      - name: Mostrar archivos generados
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/export" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n'

      - name: Subir imágenes como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: imagenes-samsung-gtowifi
          path: ${{ github.workspace }}/export/
          if-no-files-found: error
